name: Bug report
description: Something in Tiemora Core does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not report security vulnerabilities here — use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tiemora version or commit
      placeholder: v0.4.0 / abc1234
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options: [Storefront, Admin, Worker / API, Build scripts, Local development (wrangler dev), Cloudflare deployment]
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, OS, browser, relevant parts of config/store.yaml (no secrets, no real customer data).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
