<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="{{theme.primary}}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{store.name}} Admin">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Admin · {{store.name}}</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/admin/admin.js" defer></script>
</head>
<body>
  <header class="admin-header">
    <a href="#/" class="admin-brand"><img src="/assets/apple-touch-icon.png" alt="" width="56" height="56" id="brand-logo"><span><span id="brand-name">{{store.name}}</span><small data-t="adminTitle"></small></span></a>
    <nav class="admin-nav" aria-label="Admin">
      <a href="#/" data-route="dashboard" data-t="navDashboard"></a>
      <a href="#/inventory" data-route="inventory" data-t="navInventory"></a>
      <a href="#/reservations" data-route="reservations" data-t="navReservations"></a>
      <a href="#/settings" data-route="settings" data-t="navSettings"></a>
    </nav>
    <div class="admin-tools">
      <button type="button" id="bell" class="bell" aria-haspopup="true" aria-expanded="false" aria-controls="notification-panel"><span aria-hidden="true">🔔</span><b id="bell-count" hidden>0</b></button>
      <select id="admin-lang" aria-label="Language"><option value="en">English</option><option value="vi">Tiếng Việt</option><option value="ja">日本語</option></select>
      <button type="button" id="logout" class="ghost" data-t="logout"></button>
    </div>
  </header>
  <div id="notification-panel" class="notification-panel" hidden></div>
  <main id="view" class="admin-main" aria-live="polite"></main>
  <footer class="admin-footer"><a href="https://github.com/siska-tech/tiemora" target="_blank" rel="noopener noreferrer">Powered by <b>Tiemora</b></a></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
