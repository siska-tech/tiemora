<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{{theme.primary}}">
  <meta name="description" content="{{store.description}}">
  <title>{{store.name}}</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/catalog.js" defer></script>
  <script src="/gallery.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/booking.js" defer></script>
  <script src="/cart.js" defer></script>
  <script src="/order.js" defer></script>
</head>
<body>
  <div class="announcement" id="announcement" hidden><span class="spark">✧</span><span id="announcement-text"></span><a href="#collection" data-i18n="discover"></a><span>↗</span></div>
  <header class="header wrap">
    <a href="#" class="brand" id="brand" aria-label="{{store.name}}"><span class="brand-mark" id="brand-mark" hidden></span><span class="brand-wordmark"><span id="brand-name">{{store.name}}</span><span id="brand-tagline">{{store.tagline}}</span></span></a>
    <nav aria-label="Main"><a href="#collection" data-i18n="navCollection"></a><a href="#how" data-i18n="navHow"></a><a href="#contact" data-i18n="navContact"></a></nav>
    <label class="language"><img aria-hidden="true" id="language-flag" alt=""><select id="language" aria-label="Language"></select></label>
  </header>
  <main>
    <section class="hero wrap">
      <div class="hero-copy"><p class="eyebrow reveal"><span></span><span id="hero-eyebrow">{{store.name}}</span></p><h1 class="reveal" id="hero-title"></h1><p class="hero-subtitle reveal" id="hero-subtitle" hidden></p><p class="intro reveal" id="hero-description">{{store.description}}</p><div class="hero-services" aria-label="Service modes"><span data-i18n="heroDineIn"></span><span data-i18n="heroTakeaway"></span><span data-i18n="heroQr"></span></div><div class="hero-actions"><a class="button" href="#collection" id="hero-book"><span data-i18n="bookCta"></span><span>↗</span></a><a class="text-link" href="#collection" data-i18n="explore"></a><a class="text-link chat" id="hero-chat" href="#contact" target="_blank" rel="noopener noreferrer" data-i18n="consult" hidden></a></div><div class="hero-note"><span class="small-flower">✳</span><span data-i18n="heroNote"></span></div></div>
      <div class="hero-visual"><div class="hero-art" id="hero-art"><img id="hero-image" src="/assets/hero-placeholder.webp" alt="" aria-hidden="true" width="1600" height="1000" fetchpriority="high"></div><div class="visual-caption"><span data-i18n="visualCaption"></span></div><span class="hero-scroll-hint" aria-hidden="true"></span></div>
    </section>
    <div class="values" id="values" hidden><div class="wrap" id="values-list"></div></div>
    <section class="collection wrap" id="collection"><div class="section-heading"><div class="reveal"><p class="eyebrow" data-i18n="collectionEyebrow"></p><h2 data-i18n="collectionTitle"></h2></div><p class="reveal" data-i18n="collectionDescription"></p></div><div class="collection-toolbar"><div class="filters" role="group" aria-label="Collection filter"><button data-filter="all" aria-pressed="true" data-i18n="all"></button></div><div class="catalog-order"><select id="catalog-sort" aria-label="Sort"><option value="standard" data-catalog-i18n="standard"></option><option value="featured" data-catalog-i18n="featuredFirst"></option></select><span class="count" id="count" aria-live="polite"></span></div></div><div class="date-search"><label><span data-catalog-i18n="rentalDate"></span><input type="date" id="date-from"></label><label><span data-catalog-i18n="returnDate"></span><input type="date" id="date-to"></label><button type="button" id="date-clear" data-catalog-i18n="clearDates"></button><span class="date-search-note" id="date-search-note" aria-live="polite"></span></div><p class="placeholder-notice" id="placeholder-notice" hidden><span aria-hidden="true">ⓘ</span> <span data-i18n="placeholderNotice"></span></p><div id="products" class="products"></div></section>
    <section class="how wrap" id="how"><p class="eyebrow reveal" data-i18n="howEyebrow"></p><h2 class="reveal" data-i18n="howTitle"></h2><div class="steps"><article class="reveal reveal-up"><span>01</span><h3 data-i18n="step1Title"></h3><p data-i18n="step1Description"></p></article><article class="reveal reveal-up" style="--reveal-index:1"><span>02</span><h3 data-i18n="step2Title"></h3><p data-i18n="step2Description"></p></article><article class="reveal reveal-up" style="--reveal-index:2"><span>03</span><h3 data-i18n="step3Title"></h3><p data-i18n="step3Description"></p></article></div></section>
    <section class="contact" id="contact"><div class="wrap"><p class="eyebrow reveal" id="contact-eyebrow">{{store.name}}</p><h2 class="reveal" data-i18n="contactTitle"></h2><p class="reveal" data-i18n="contactDescription"></p><div class="contact-channels" id="contact-channels"></div><div class="store-details" id="store-details" hidden></div></div></section>
  </main>
  <button type="button" id="cart-bar" class="cart-bar" hidden aria-haspopup="dialog"><span id="cart-bar-label"></span><b id="cart-bar-total"></b></button>
  <footer class="wrap"><a href="#" class="brand"><span class="brand-wordmark"><span id="footer-name">{{store.name}}</span><span id="footer-tagline">{{store.tagline}}</span></span></a><p data-i18n="footer"></p><nav class="footer-links" aria-label="Footer"><a href="/privacy" data-i18n="privacy"></a><a href="#contact" data-i18n="navContact"></a><a class="powered" href="https://github.com/siska-tech/tiemora" target="_blank" rel="noopener noreferrer">Powered by <b>Tiemora</b></a></nav></footer>
  <dialog id="product-dialog"><button class="close" id="close-dialog" aria-label="Close">×</button><div id="dialog-art"></div><div class="dialog-copy"><p class="eyebrow" id="dialog-category"></p><h2 id="dialog-title"></h2><p id="dialog-description"></p><p class="product-price" id="dialog-price"></p><p id="dialog-details"></p>
    <div class="booking" id="dialog-booking" hidden><p class="eyebrow" data-booking-i18n="title"></p><div class="booking-fields"><label><span data-booking-i18n="from"></span><input type="date" id="booking-from"></label><label><span data-booking-i18n="to"></span><input type="date" id="booking-to"></label><label id="booking-size-field" hidden><span data-booking-i18n="size"></span><select id="booking-size"></select></label></div><p class="booking-status" id="booking-status" role="status" aria-live="polite"></p><button type="button" class="button" id="booking-open" disabled><span data-booking-i18n="cta"></span><span>↗</span></button></div>
    <div class="order-block" id="dialog-order" hidden><p class="eyebrow" data-order-i18n="title"></p><div id="order-options"></div><div id="order-addons"></div><div class="order-quantity"><span data-order-i18n="quantity"></span><div class="qty"><button type="button" id="qty-minus" aria-label="−">−</button><input id="order-qty" type="number" inputmode="numeric" min="1" max="20" value="1" aria-label="Quantity"><button type="button" id="qty-plus" aria-label="+">+</button></div></div><p class="order-total" id="order-total"></p><p class="order-status" id="order-status" role="status" aria-live="polite"></p><button type="button" class="button" id="order-open"><span data-order-i18n="cta"></span><span>↗</span></button></div>
    <a class="button chat" id="dialog-chat" href="#contact" target="_blank" rel="noopener noreferrer"><span data-i18n="consult"></span><span>↗</span></a><p id="dialog-copy-status" class="copy-status" role="status" aria-live="polite"></p></div></dialog>
  <dialog id="order-dialog" aria-labelledby="order-title"><button class="close" id="close-order" aria-label="Close">×</button>
    <form id="order-form" class="booking-form order-form" novalidate>
      <p class="eyebrow" data-order-i18n="title"></p><h2 id="order-title" data-order-i18n="formTitle" tabindex="-1"></h2>
      <div class="booking-summary" id="order-summary"></div>
      <section class="order-section" id="order-card-section"><h3><span class="step">1</span><span data-order-i18n="cardTitle"></span></h3><div class="template-chips" id="card-templates"></div><label class="full"><span class="sr-only" data-order-i18n="cardTitle"></span><textarea name="message_card" rows="3" id="message-card"></textarea><small class="counter" id="card-counter"></small></label></section>
      <section class="order-section"><h3><span class="step">2</span><span data-order-i18n="fulfillmentTitle"></span></h3><div class="channel-cards" id="fulfillment-cards" role="radiogroup"></div>
        <div class="delivery-fields" id="delivery-fields" hidden>
          <label><span data-order-i18n="recipientName" class="req"></span><input name="recipient_name" maxlength="100" autocomplete="off"></label>
          <label><span data-order-i18n="recipientPhone" class="req"></span><input name="recipient_phone" type="tel" maxlength="40" inputmode="tel"></label>
          <label class="full"><span data-order-i18n="address" class="req"></span><input name="delivery_address" maxlength="300" autocomplete="street-address"></label>
          <label class="full"><span data-order-i18n="deliveryNote"></span><input name="delivery_note" maxlength="300"></label>
          <p class="delivery-note" id="delivery-note-text"></p>
        </div></section>
      <div class="delivery-fields" id="dine-in-fields" hidden>
        <label class="full"><span data-order-i18n="tableNumber" class="req"></span><input name="table_number" inputmode="numeric" maxlength="4" pattern="[0-9]{1,4}"></label>
      </div>
      <section class="order-section"><h3><span class="step">3</span><span data-order-i18n="whenTitle"></span></h3><p class="order-window" id="order-window"></p><div class="date-chips" id="date-chips" role="radiogroup"></div><div class="slot-chips" id="slot-chips" role="radiogroup"></div></section>
      <section class="order-section"><h3><span class="step">4</span><span data-order-i18n="customerTitle"></span></h3>
      <div class="booking-grid">
        <label class="full"><span data-order-i18n="name" class="req"></span><input name="customer_name" required maxlength="100" autocomplete="name"></label>
        <label class="full"><span data-order-i18n="phone" class="req"></span><input name="customer_phone" type="tel" required maxlength="40" autocomplete="tel" inputmode="tel"></label>
        <fieldset class="full channel-group"><legend data-order-i18n="preferred" class="req"></legend><div class="channel-cards" id="order-channels" role="radiogroup"></div></fieldset>
        <div class="full channel-field" data-channel-field="zalo" hidden>
          <label class="check"><input type="checkbox" name="zalo_same" checked><span data-order-i18n="sameAsPhone"></span></label>
          <label class="channel-number"><span data-order-i18n="zaloNumber"></span><input name="customer_zalo_phone" type="tel" maxlength="40" inputmode="tel"></label>
        </div>
        <div class="full channel-field" data-channel-field="whatsapp" hidden>
          <label class="check"><input type="checkbox" name="whatsapp_same" checked><span data-order-i18n="sameAsPhone"></span></label>
          <label class="channel-number"><span data-order-i18n="whatsappNumber"></span><input name="customer_whatsapp" type="tel" maxlength="40" inputmode="tel"></label>
        </div>
        <div class="full channel-field" data-channel-field="messenger" hidden>
          <label><span data-order-i18n="messengerUrl"></span><input name="customer_messenger_url" maxlength="300" inputmode="url" placeholder="https://facebook.com/… / https://m.me/…"><small data-order-i18n="optional"></small></label>
        </div>
        <label class="full"><span data-order-i18n="note"></span><textarea name="note" maxlength="500" rows="2"></textarea></label>
      </div></section>
      <div id="order-turnstile" class="turnstile"></div>
      <p id="order-turnstile-warning" class="booking-admin-warning" role="note" hidden></p>
      <p class="booking-terms" data-order-i18n="terms"></p>
      <p class="booking-terms payment-note" data-order-i18n="payment"></p>
      <label class="check consent" id="order-consent-row"><input type="checkbox" name="privacy_consent" id="order-privacy-consent"><span id="order-consent-text"></span></label>
      <p class="booking-error" id="order-error" role="alert"></p>
      <button type="submit" class="button" id="order-submit"><span data-order-i18n="submit"></span><span id="order-submit-total"></span></button>
    </form>
    <div id="order-done" class="booking-done" hidden></div>
  </dialog>
  <dialog id="booking-dialog" aria-labelledby="booking-title"><button class="close" id="close-booking" aria-label="Close">×</button>
    <form id="booking-form" class="booking-form" novalidate>
      <p class="eyebrow" data-booking-i18n="title"></p><h2 id="booking-title" data-booking-i18n="formTitle"></h2>
      <div class="booking-summary" id="booking-summary"></div>
      <div class="booking-grid">
        <label class="full"><span data-booking-i18n="name" class="req"></span><input name="customer_name" required maxlength="100" autocomplete="name"></label>
        <label class="full"><span data-booking-i18n="phone" class="req"></span><input name="customer_phone" type="tel" required maxlength="40" autocomplete="tel" inputmode="tel"></label>
        <fieldset class="full channel-group"><legend data-booking-i18n="preferred" class="req"></legend><div class="channel-cards" id="booking-channels" role="radiogroup"></div></fieldset>
        <div class="full channel-field" data-channel-field="zalo" hidden>
          <label class="check"><input type="checkbox" name="zalo_same" checked><span data-booking-i18n="sameAsPhone"></span></label>
          <label class="channel-number"><span data-booking-i18n="zaloNumber"></span><input name="customer_zalo_phone" type="tel" maxlength="40" inputmode="tel" autocomplete="tel"></label>
        </div>
        <div class="full channel-field" data-channel-field="whatsapp" hidden>
          <label class="check"><input type="checkbox" name="whatsapp_same" checked><span data-booking-i18n="sameAsPhone"></span></label>
          <label class="channel-number"><span data-booking-i18n="whatsappNumber"></span><input name="customer_whatsapp" type="tel" maxlength="40" inputmode="tel" autocomplete="tel"></label>
        </div>
        <div class="full channel-field" data-channel-field="messenger" hidden>
          <label><span data-booking-i18n="messengerUrl"></span><input name="customer_messenger_url" maxlength="300" inputmode="url" autocomplete="url" placeholder="https://facebook.com/… / https://m.me/…"><small data-booking-i18n="optional"></small></label>
        </div>
        <label class="full"><span data-booking-i18n="note"></span><textarea name="note" maxlength="500" rows="3"></textarea></label>
      </div>
      <div id="turnstile" class="turnstile"></div>
      <p id="turnstile-warning" class="booking-admin-warning" role="note" hidden></p>
      <p class="booking-terms" data-booking-i18n="terms"></p>
      <label class="check consent" id="consent-row"><input type="checkbox" name="privacy_consent" id="privacy-consent"><span id="consent-text"></span></label>
      <p class="booking-error" id="booking-error" role="alert"></p>
      <button type="submit" class="button" id="booking-submit"><span data-booking-i18n="submit"></span><span>↗</span></button>
    </form>
    <div id="booking-done" class="booking-done" hidden></div>
  </dialog>
</body>
</html>
