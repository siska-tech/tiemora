# Tiemora store configuration.
# Everything that makes this deployment *your* store lives here. The build validates this file and
# publishes it as /store.json (read by the storefront, the admin page and the Worker), so put nothing
# secret in it: passwords and API keys go in .dev.vars / `wrangler secret put` instead.
# See docs/configuration.md for every key.

store:
  name: "Phở Góc Phố"
  # Short line under the name in the header / footer.
  tagline:
    vi: "Hà Nội"
    en: "Hanoi noodles"
    ja: "ハノイの麺店"
    zh: "河内面店"
  # Used for the <meta name="description"> and the hero paragraph.
  description:
    vi: "Phở Góc Phố là cửa hàng Phở địa phương kiểu Hà Nội: món nóng, đặt món nhanh qua điện thoại, mang về hoặc ăn tại quán."
    en: "Phở Góc Phố is a small Hanoi-style noodle shop: warm bowls, quick mobile ordering, takeaway or dine-in."
    ja: "Phở Góc Phố はハノイ風の小さな麺店です。温かい一杯と、スマホ注文で店内・持ち帰りに対応します。"
    zh: "Phở Góc Phố 是一家河内风格的小面馆：热气腾腾的面食，支持手机点单、堂食和外带。"
  # Optional logo shown in the header (a path under storefront/assets/, e.g. /assets/logo.webp).
  logo: "/assets/logo.png"
  # mark (default): a square symbol next to the store name; wordmark: the logo already contains the
  # name and replaces the text.
  logoStyle: mark
  hero:
    layout: environmental
    # Optional small kicker line above the title; null shows the store name.
    eyebrow:
      vi: "MỖI NGÀY MỘT BÁT PHỞ"
      en: "Fresh bowls, every day"
      ja: "毎日、あたたかい一杯"
      zh: "每天一碗热汤"
    # Optional. Without a title the storefront uses its built-in generic headline. \n starts a new line
    # and <em>…</em> highlights a word.
    title:
      vi: "Phở nóng,\nmỗi ngày."
      en: "Hot pho,\nevery day."
      ja: "毎日、\nあたたかいフォー。"
      zh: "每天一碗\n热河粉。"
    # Optional italic line under the title.
    subtitle:
      vi: "Một chút Hà Nội trong từng bát phở."
      en: "A little Hanoi in every bowl."
      ja: "一杯のフォーに、ハノイの気分を。"
      zh: "每一碗河粉，都有一点河内。"
    # Optional hero image (a path under storefront/assets/). The default is a neutral illustration.
    image: "/assets/hero.png"
    # environmental: a full-width scene with copy over the street context; cover: the image fills the frame.
    fit: cover
    # CSS object-position for the cover fit, e.g. "70% 50%"; only used when fit: cover. On phones the
    # environmental layout centres the crop on the subject instead.
    focus: 38% 50%
    # The point of the image the scroll zoom closes in on (environmental layout): the bowl of phở.
    subject: 68% 70%
  # Optional banner above the header; null hides it.
  announcement:
    vi: "Đây là cửa hàng mẫu · Dữ liệu chỉ để minh họa"
    en: "This is a demo store · All data is sample data"
    ja: "これはデモストアです · データはすべてサンプルです"
    zh: "这是演示商店 · 所有数据均为示例"
  # Up to three short claims shown under the hero.
  values:
    - {vi: "Phở nóng hằng ngày", en: "Hot bowls daily", ja: "毎日温かい一杯", zh: "每日热汤面"}
    - {vi: "Mang về hoặc ăn tại quán", en: "Takeaway or dine in", ja: "持ち帰りまたは店内", zh: "外带或堂食"}
    - {vi: "QR đặt món nhanh", en: "Fast QR ordering", ja: "QRで簡単注文", zh: "快速 QR 点餐"}
  # Overrides for the storefront's built-in UI copy (keys of `copy` in storefront/app.js). Empty by
  # default; use this to reword the page for your industry without touching code, e.g.
  # bookCta: {vi: "Đặt hàng", en: "Order now"}.
  text:
    bookCta: {vi: "Xem thực đơn", en: "View menu", ja: "メニューを見る", zh: "查看菜单"}
    explore: {vi: "Đặt món mang về", en: "Order takeaway", ja: "テイクアウトを注文", zh: "订购外带"}
    heroNote: {vi: "Chọn món, chọn giờ và gửi đơn trong một phút.", en: "Choose a bowl, pick a time and order in a minute.", ja: "料理と時間を選んで、1分で注文できます。", zh: "选择菜品和时间，一分钟即可下单。"}
    visualCaption: {vi: "Phố · Bếp · Bát nóng", en: "Street · Kitchen · Hot bowls", ja: "街 · 厨房 · 温かい一杯", zh: "街道 · 厨房 · 热汤"}
    collectionEyebrow: {vi: "THỰC ĐƠN", en: "THE MENU", ja: "メニュー", zh: "菜单"}
    collectionTitle: {vi: "Một bát nóng,\nđúng vị Hà Nội.", en: "A hot bowl,\nthe Hanoi way.", ja: "ハノイの味を、\nあたたかい一杯で。", zh: "一碗热汤，\n河内风味。"}
    collectionDescription: {vi: "Chọn món, thêm topping, mang về hoặc ăn tại quán.", en: "Choose a bowl, add toppings, take away or dine in.", ja: "料理とトッピングを選び、持ち帰りまたは店内でどうぞ。", zh: "选择菜品和加料，外带或堂食。"}
    howEyebrow: {vi: "GỌI MÓN", en: "HOW TO ORDER", ja: "注文方法", zh: "点餐方式"}
    step1Title: {vi: "Chọn món", en: "Choose a bowl", ja: "料理を選ぶ", zh: "选择菜品"}
    step1Description: {vi: "Chọn phở bò, phở gà và các món thêm trong thực đơn.", en: "Choose beef pho, chicken pho and extras from the menu.", ja: "牛肉・鶏肉のフォーと追加メニューを選びます。", zh: "选择牛肉河粉、鸡肉河粉和加购。"}
    step2Title: {vi: "Chọn giờ nhận", en: "Pick a time", ja: "時間を選ぶ", zh: "选择时间"}
    step2Description: {vi: "Chọn mang về hoặc nhập số bàn để ăn tại quán.", en: "Choose takeaway or enter your table number for dine-in.", ja: "持ち帰りか、テーブル番号を入力して店内注文します。", zh: "选择外带，或输入桌号进行堂食。"}
    step3Title: {vi: "Bếp chuẩn bị", en: "We make it fresh", ja: "店内で調理", zh: "现点现做"}
    step3Description: {vi: "Quán xác nhận đơn và chuẩn bị bát phở nóng cho bạn.", en: "The shop confirms your order and prepares a fresh hot bowl.", ja: "お店が注文を確認し、温かい一杯を用意します。", zh: "店铺确认订单并准备热腾腾的一碗。"}
    contactTitle: {vi: "Ghé quán nhé.", en: "Come by for a bowl.", ja: "一杯、食べに来てください。", zh: "来吃一碗吧。"}
    contactDescription: {vi: "Cần hỏi món hoặc đặt bàn? Nhắn cho Phở Góc Phố qua kênh bạn thích.", en: "Questions or a table order? Message Phở Góc Phố on your preferred channel.", ja: "メニューや店内注文については、お好きな方法でご連絡ください。", zh: "想咨询菜单或桌边点餐？欢迎通过常用渠道联系我们。"}
    footer: {vi: "Món, giờ nhận và tình trạng còn hàng được quán xác nhận.", en: "The shop confirms menu availability and pickup time.", ja: "メニューの在庫と受取時間はお店が確認します。", zh: "菜品供应和取餐时间以店铺确认为准。"}
    heroDineIn: {vi: "Ăn tại quán", en: "Dine in", ja: "店内食事", zh: "堂食"}
    heroTakeaway: {vi: "Mang về", en: "Takeaway", ja: "持ち帰り", zh: "外带"}
    heroQr: {vi: "QR tại bàn", en: "QR at table", ja: "テーブルQR", zh: "桌边 QR"}

catalog:
  # The live demo catalog for the Phở shop. The generic sample catalog stays untouched for core
  # regression checks; this config points directly at the local-food reference set.
  dir: examples/pho-demo

# Languages offered in the switcher, in order. Supported: vi, en, ja, zh.
languages: [vi, en, ja, zh]
defaultLanguage: vi
currency: VND
# IANA time zone used for "today" (availability, dashboard).
timezone: Asia/Ho_Chi_Minh
# Country calling code assumed for local numbers (0901234567 -> 84901234567 for WhatsApp links).
phoneCountryCode: "84"

# Public contact channels shown in the storefront footer / contact section and used by the admin's
# customer-notification helpers. null hides a channel.
contact:
  facebook: null          # https://www.facebook.com/yourpage
  messenger: null         # https://m.me/yourpage
  zalo: "090 123 4567"   # phone number or https://zalo.me/…
  whatsapp: "0901234567" # phone number
  phone: "+84 901 234 567" # "+84 …"
  email: "hello@phogocpho.vn"
  address:
    vi: "12 Phố Góc Nhỏ, Hà Nội · Địa chỉ mẫu"
    en: "12 Phố Góc Nhỏ, Hanoi — Demo address"
  mapUrl: null            # https://maps.google.com/…

# Labels for catalog categories (the folder name or `category:` in product.yaml). Unlisted
# categories are shown by their id.
categories:
  pho-bo: {vi: "Phở bò", en: "Beef pho", ja: "牛肉フォー", zh: "牛肉河粉"}
  pho-ga: {vi: "Phở gà", en: "Chicken pho", ja: "鶏肉フォー", zh: "鸡肉河粉"}
  mon-them: {vi: "Món thêm", en: "Add-ons", ja: "おつまみ", zh: "加购"}
  do-uong: {vi: "Đồ uống", en: "Drinks", ja: "ドリンク", zh: "饮品"}
  combo: {vi: "Combo", en: "Combo", ja: "セット", zh: "套餐"}

# Brand colours (6-digit hex). Written to /theme.css by the build.
theme:
  primary: "#214c3c"
  accent: "#bf5d3a"
  paper: "#f7f0e8"
  ink: "#2d2119"
  muted: "#6e584c"
  line: "#e5d5bf"

booking:
  # Longest rental a customer may request from the public form, and how far ahead.
  maxRentalDays: 60
  maxDaysAhead: 365
  # Free days kept between one rental's return date and the next rental's start date.
  bufferDays: 0

# Sale / pre-order products (type: sale in product.yaml, see examples/sale/ and docs/orders.md).
# Capacity is counted, not itemised: a time slot holds N orders, a day holds N orders, a product
# sells N units. Every limit below is optional; leave it null and nothing is enforced or shown as scarce.
ordering:
  fulfillment:
    pickup: true
    delivery: false
    dine_in: true
    deliveryFee: 0
    deliveryNote: null
  # The tables the shop has: a QR code may name any of these and nothing else.
  tables:
    min: 1
    max: 24
  # Either an explicit campaign window (from / to) or a rolling one (minLeadDays / maxDaysAhead).
  dates:
    from: null
    to: null
    minLeadDays: 1
    maxDaysAhead: 14
  deadline: null
  dailyCapacity: 80
  timeSlots:
    - {id: "1030", start: "10:30", end: "10:45", capacity: 8, label: {vi: "10:30", en: "10:30"}}
    - {id: "1045", start: "10:45", end: "11:00", capacity: 8, label: {vi: "10:45", en: "10:45"}}
    - {id: "1100", start: "11:00", end: "11:15", capacity: 8, label: {vi: "11:00", en: "11:00"}}
    - {id: "1115", start: "11:15", end: "11:30", capacity: 8, label: {vi: "11:15", en: "11:15"}}
    - {id: "1130", start: "11:30", end: "11:45", capacity: 8, label: {vi: "11:30", en: "11:30"}}
    - {id: "1145", start: "11:45", end: "12:00", capacity: 8, label: {vi: "11:45", en: "11:45"}}
  openingHours:
    mon: [{start: "10:00", end: "13:00"}]
    tue: [{start: "10:00", end: "13:00"}]
    wed: [{start: "10:00", end: "13:00"}]
    thu: [{start: "10:00", end: "13:00"}]
    fri: [{start: "10:00", end: "13:00"}]
    sat: [{start: "10:00", end: "13:00"}]
    sun: [{start: "10:00", end: "13:00"}]
  # Labels and default price deltas for the option / add-on ids products list in product.yaml.
  # Bowls use size / noodles / herbs / spice; drinks use size / ice / sweetness; the egg uses doneness.
  options:
    size:
      label: {vi: "Size", en: "Size", ja: "サイズ", zh: "份量"}
      choices:
        regular: {label: {vi: "Thường", en: "Regular", ja: "並", zh: "普通"}}
        large: {label: {vi: "Lớn", en: "Large", ja: "大", zh: "大份"}, price: 15000}
    noodles:
      label: {vi: "Bánh phở", en: "Noodles", ja: "麺の量", zh: "河粉量"}
      choices:
        normal: {label: {vi: "Bình thường", en: "Normal", ja: "普通", zh: "正常"}}
        less: {label: {vi: "Ít", en: "Less", ja: "少なめ", zh: "少一点"}}
        extra: {label: {vi: "Thêm", en: "Extra", ja: "多め", zh: "加量"}, price: 10000}
    herbs:
      label: {vi: "Rau thơm", en: "Herbs", ja: "香草", zh: "香草"}
      choices:
        normal: {label: {vi: "Bình thường", en: "Normal", ja: "あり", zh: "正常"}}
        no-herbs: {label: {vi: "Không rau", en: "No herbs", ja: "なし", zh: "不要香草"}}
    spice:
      label: {vi: "Ớt", en: "Spice", ja: "辛さ", zh: "辣度"}
      choices:
        none: {label: {vi: "Không cay", en: "No chili", ja: "辛くない", zh: "不辣"}}
        normal: {label: {vi: "Bình thường", en: "Normal", ja: "普通", zh: "正常"}}
        extra: {label: {vi: "Cay thêm", en: "Extra chili", ja: "辛め", zh: "加辣"}, price: 5000}
    ice:
      label: {vi: "Đá", en: "Ice", ja: "氷", zh: "冰"}
      choices:
        normal: {label: {vi: "Bình thường", en: "Normal", ja: "普通", zh: "正常"}}
        less: {label: {vi: "Ít đá", en: "Less ice", ja: "少なめ", zh: "少冰"}}
        none: {label: {vi: "Không đá", en: "No ice", ja: "なし", zh: "去冰"}}
    sweetness:
      label: {vi: "Độ ngọt", en: "Sweetness", ja: "甘さ", zh: "甜度"}
      choices:
        normal: {label: {vi: "Bình thường", en: "Normal", ja: "普通", zh: "正常"}}
        less: {label: {vi: "Ít ngọt", en: "Less sweet", ja: "控えめ", zh: "少糖"}}
        extra: {label: {vi: "Ngọt hơn", en: "Sweeter", ja: "甘め", zh: "多糖"}}
    doneness:
      label: {vi: "Độ chín", en: "Doneness", ja: "火の通り", zh: "熟度"}
      choices:
        soft: {label: {vi: "Lòng đào", en: "Runny", ja: "半熟", zh: "溏心"}}
        well-done: {label: {vi: "Chín kỹ", en: "Well done", ja: "固め", zh: "全熟"}}
  addons:
    extra-beef: {label: {vi: "Thêm bò", en: "Extra beef", ja: "牛肉追加", zh: "加牛肉"}, price: 20000}
    extra-chicken: {label: {vi: "Thêm gà", en: "Extra chicken", ja: "鶏肉追加", zh: "加鸡肉"}, price: 20000}
    egg: {label: {vi: "Trứng chần", en: "Soft-boiled egg", ja: "半熟卵", zh: "溏心蛋"}, price: 10000}
    quay: {label: {vi: "Quẩy", en: "Quẩy", ja: "揚げパン", zh: "油条"}, price: 10000}
    extra-noodles: {label: {vi: "Thêm bánh phở", en: "Extra noodles", ja: "麺追加", zh: "加河粉"}, price: 15000}
    extra-shot: {label: {vi: "Thêm cà phê", en: "Extra shot", ja: "コーヒー追加", zh: "加浓"}, price: 10000}
  # The gift-card field carries requests about the food (allergies, no coriander, extra lime); it goes
  # to the kitchen and into the confirmation message. The general "note for the shop" at the end of the
  # form stays for everything else (running late, call on arrival).
  messageCard:
    enabled: true
    maxLength: 160
    title: {vi: "Yêu cầu về món", en: "Special requests", ja: "料理のリクエスト", zh: "菜品要求"}
    placeholder:
      vi: "Ví dụ: không hành, ít ớt, dị ứng… (không bắt buộc)"
      en: "e.g. no spring onion, less chili, allergies… (optional)"
      ja: "例: ネギ抜き、辛さ控えめ、アレルギー…(任意)"
      zh: "例如：不要葱、少辣、过敏…(选填)"
    templates:
      - {id: no-onion, label: {vi: "Không hành", en: "No spring onion", ja: "ネギ抜き", zh: "不要葱"}, text: {vi: "Không hành", en: "No spring onion", ja: "ネギ抜き", zh: "不要葱"}}
      - {id: no-coriander, label: {vi: "Không rau mùi", en: "No coriander", ja: "パクチー抜き", zh: "不要香菜"}, text: {vi: "Không rau mùi", en: "No coriander", ja: "パクチー抜き", zh: "不要香菜"}}
      - {id: less-fat, label: {vi: "Ít béo", en: "Less fat", ja: "脂少なめ", zh: "少油"}, text: {vi: "Ít béo", en: "Less fat", ja: "脂少なめ", zh: "少油"}}

admin:
  # Language the admin page opens in (vi, en or ja) until staff pick another.
  defaultLanguage: en
