# Tiemora store configuration.
# Everything that makes this deployment *your* store lives here. The build validates this file and
# publishes it as /store.json (read by the storefront, the admin page and the Worker), so put nothing
# secret in it: passwords and API keys go in .dev.vars / `wrangler secret put` instead.
# See docs/configuration.md for every key.

store:
  name: "Tiemora Demo Store"
  # Short line under the name in the header / footer.
  tagline:
    vi: "Cửa hàng mẫu"
    en: "Demo store"
    ja: "デモストア"
    zh: "演示商店"
  # Used for the <meta name="description"> and the hero paragraph.
  description:
    vi: "Cửa hàng mẫu sử dụng Tiemora: xem sản phẩm, kiểm tra lịch trống và gửi yêu cầu đặt chỗ."
    en: "A demo store powered by Tiemora: browse the catalog, check availability and send a booking request."
    ja: "Tiemora のデモストアです。商品を見て、空き状況を確認し、予約申請を送れます。"
    zh: "由 Tiemora 驱动的演示商店：浏览商品、查看可用日期并发送预约申请。"
  # Optional logo shown in the header (a path under storefront/assets/, e.g. /assets/logo.webp).
  logo: null
  # mark (default): a square symbol next to the store name; wordmark: the logo already contains the
  # name and replaces the text.
  logoStyle: mark
  hero:
    # split (default): separate text and image; environmental: an immersive scene the page zooms into.
    layout: split
    # Optional small kicker line above the title; null shows the store name.
    eyebrow: null
    # Optional. Without a title the storefront uses its built-in generic headline. \n starts a new line
    # and <em>…</em> highlights a word.
    title:
      vi: "Chọn một món đồ.\nGiữ một <em>kỷ niệm.</em>"
      en: "Pick something beautiful.\nKeep the <em>memory.</em>"
      ja: "お気に入りを選んで、\n思い出を<em>残す。</em>"
      zh: "选一件心仪之物，\n留住<em>美好回忆。</em>"
    # Optional italic line under the title.
    subtitle: null
    # Optional hero image (a path under storefront/assets/). The default is a neutral illustration.
    image: null
    # pan (default): a tall crop that slides sideways on scroll; cover: the image fills the frame.
    fit: pan
    # CSS object-position for the cover fit, e.g. "70% 50%"; only used when fit: cover.
    focus: null
    # The point of the image the scroll zoom closes in on; only used when layout: environmental.
    # null uses hero.focus.
    subject: null
  # Optional banner above the header; null hides it.
  announcement:
    vi: "Đây là cửa hàng mẫu · Dữ liệu chỉ để minh họa"
    en: "This is a demo store · All data is sample data"
    ja: "これはデモストアです · データはすべてサンプルです"
    zh: "这是演示商店 · 所有数据均为示例"
  # Up to three short claims shown under the hero.
  values:
    - {vi: "Đặt chỗ trực tuyến", en: "Book online", ja: "オンラインで予約", zh: "在线预约"}
    - {vi: "Xác nhận qua Zalo / WhatsApp", en: "Confirmed on Zalo / WhatsApp", ja: "Zalo / WhatsApp で確認", zh: "通过 Zalo / WhatsApp 确认"}
    - {vi: "Không cần tài khoản", en: "No account needed", ja: "アカウント不要", zh: "无需注册账号"}
  # Overrides for the storefront's built-in UI copy (keys of `copy` in storefront/app.js). Empty by
  # default; use this to reword the page for your industry without touching code, e.g.
  # bookCta: {vi: "Đặt hàng", en: "Order now"}.
  text: {}

catalog:
  # Folder scanned for product.yaml files, relative to the project root. Point it at catalog/ once you
  # have added your own products; examples/catalog/ holds three fictional sample items.
  dir: examples/catalog

# Languages offered in the switcher, in order. Supported: vi, en, ja, zh.
languages: [vi, en, ja, zh]
defaultLanguage: vi
currency: VND
# IANA time zone used for "today" (availability, dashboard).
timezone: Asia/Ho_Chi_Minh
# Country calling code assumed for local numbers (0901234567 -> 84901234567 for WhatsApp links).
phoneCountryCode: "84"

# Public contact channels shown in the storefront footer / contact section and used by the admin's
# customer-notification helpers. null hides a channel.
contact:
  facebook: null          # https://www.facebook.com/yourpage
  messenger: null         # https://m.me/yourpage
  zalo: null              # phone number or https://zalo.me/…
  whatsapp: null          # phone number
  phone: null             # "+84 …"
  email: null
  address: null           # text or {vi: …, en: …}
  mapUrl: null            # https://maps.google.com/…

# Labels for catalog categories (the folder name or `category:` in product.yaml). Unlisted
# categories are shown by their id.
categories:
  rental: {vi: "Cho thuê", en: "Rental", ja: "レンタル", zh: "租赁"}
  accessories: {vi: "Phụ kiện", en: "Accessories", ja: "小物", zh: "配饰"}
  # Used by examples/sale/ (type: sale products); unlisted categories are shown by their id.
  gifts: {vi: "Quà tặng", en: "Gifts", ja: "ギフト", zh: "礼品"}
  seasonal: {vi: "Theo mùa", en: "Seasonal", ja: "季節限定", zh: "季节性"}

# Brand colours (6-digit hex). Written to /theme.css by the build.
theme:
  primary: "#3b5b6b"
  accent: "#c08a4a"
  paper: "#faf8f3"
  ink: "#26302f"
  muted: "#6f7a78"
  line: "#e2e5df"

booking:
  # Longest rental a customer may request from the public form, and how far ahead.
  maxRentalDays: 60
  maxDaysAhead: 365
  # Free days kept between one rental's return date and the next rental's start date.
  bufferDays: 0
  # Rentals on the clock (optional; see docs/booking.md). Without these, bookings stay on whole
  # calendar days as before. With handoff hours, a customer picks a day, a time and a length, and
  # rent is charged per 24 hours from collection.
  # displayStart: "06:00"   # the time axis the customer sees
  # displayEnd: "22:00"     # exclusive; "24:00" is allowed
  # slotMinutes: 30
  # openingHours:           # when the shop is open (omit = unrestricted)
  #   mon: [{start: "09:00", end: "20:00"}]
  # handoff:                # when somebody can hand an item over; single dates that differ are set in the admin
  #   weekly:
  #     mon: [{start: "09:00", end: "12:00"}, {start: "17:00", end: "20:00"}]
  #   holidayCountry: VN    # public holidays, listed at build time (date-holidays)
  #   holidayDates: []      # extra holiday dates by hand, YYYY-MM-DD
  #   holidayWindows: [{start: "00:00", end: "24:00"}]   # hours on a holiday (default all day; [] closes)
  # turnaround:             # how long a returned item needs before it can go out again
  #   strategy: none        # none | hours | overnight
  #   hours: 0              # for strategy: hours
  #   returnCutoff: "20:00" # for strategy: overnight -- back by then, ready the next morning at...
  #   readyNextDayAt: "07:00"
  # fitting:                # try-on appointments: hold one item for a short visit, free of charge
  #   enabled: false
  #   minutes: 30
  #   bufferMinutes: 0
  # Rental terms (deposit, late return, damage), one per line: shown above the consent box on the
  # booking form and added to the confirmation message.
  # policy:
  #   en: |
  #     A deposit or an identity document is held while you rent.
  #     If a return is late, the extra time is charged.
  #     If an item is damaged, you pay for its repair or its value.

# Sale / pre-order products (type: sale in product.yaml, see examples/sale/ and docs/orders.md).
# Capacity is counted, not itemised: a time slot holds N orders, a day holds N orders, a product
# sells N units. Every limit below is optional; leave it null and nothing is enforced or shown as scarce.
ordering:
  fulfillment:
    pickup: true
    delivery: true
    # Eat-in orders: the order then carries a table number. Off unless the shop has tables.
    dine_in: false
    deliveryFee: 0
    deliveryNote: null
  # The table numbers a dine-in order may name; only read when fulfillment.dine_in is on.
  # tables:
  #   min: 1
  #   max: 99
  # Either an explicit campaign window (from / to) or a rolling one (minLeadDays / maxDaysAhead).
  dates:
    from: null
    to: null
    minLeadDays: 1
    maxDaysAhead: 14
  deadline: null
  dailyCapacity: null
  timeSlots: []
  # When the shop is open, checked in the store's time zone (omit = unrestricted). A weekday that is
  # absent or empty is closed, and a time slot must fall wholly inside one of the day's intervals.
  # openingHours:
  #   mon: [{start: "09:00", end: "20:00"}]
  # "As soon as you can": an order with no time slot. Accepted only for today and only while the
  # shop is open. leadMinutes is what the customer is told to expect, not a promise the server keeps.
  # asap:
  #   enabled: false
  #   leadMinutes: null
  # Labels and default price deltas for the option / add-on ids products list in product.yaml.
  options:
    size:
      label: {vi: "Kích cỡ", en: "Size"}
      choices:
        small: {label: {vi: "Nhỏ", en: "Small"}}
        medium: {label: {vi: "Vừa", en: "Medium"}}
        large: {label: {vi: "Lớn", en: "Large"}}
  addons:
    giftwrap: {label: {vi: "Gói quà", en: "Gift wrap"}, price: 20000}
  messageCard:
    enabled: true
    maxLength: 200
    # Replaces the "Card message" heading, e.g. {vi: "Ghi chú cho bếp", en: "Note for the kitchen"}.
    title: null
    placeholder: null
    templates: []

admin:
  # Language the admin page opens in (vi, en or ja) until staff pick another.
  defaultLanguage: en
  # Push the day's pick-ups and returns to subscribed admin devices (store time; needs VAPID keys).
  # digest:
  #   today: "06:30"      # that day's plan, in the morning
  #   tomorrow: "21:00"   # the next day's, the evening before
