  vi: Sản phẩm mẫu dùng để minh họa tính năng đặt hàng (Orders) của Tiemora. Có thể chọn kích cỡ, thêm gói quà và nhận tại cửa hàng hoặc giao tận nơi.
  en: A sample item used to demonstrate Tiemora's Orders feature. Choose a size, add gift wrapping and pick up in store or have it delivered.
  ja: Tiemora の注文（Orders）機能を確認するためのサンプル商品です。サイズを選び、ギフトラッピングを追加して、店頭受取または配送を選べます。
